<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace - Auto Movie Recap</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="logo">RECAP.AI</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="editing.html">Workspace</a>
            <a href="about.html">About</a>
        </div>
    </nav>

    <main class="container">
        <h2 style="margin-bottom: 2rem;">Auto Recap Workspace</h2>
        
        <div class="dropzone" id="videoDropzone">
            <i class="fas fa-film fa-3x" style="margin-bottom: 1rem;"></i>
            <p>Drag & Drop Movie Video (MP4, MOV, AVI)</p>
            <input type="file" id="videoInput" hidden accept="video/*">
            <p id="videoStatus" style="margin-top: 1rem; color: var(--primary); font-weight: bold;"></p>
        </div>

        <div class="dropzone" id="srtDropzone">
            <i class="fas fa-closed-captioning fa-3x" style="margin-bottom: 1rem;"></i>
            <p>Drag & Drop Subtitle SRT File</p>
            <input type="file" id="srtInput" hidden accept=".srt">
            <p id="srtStatus" style="margin-top: 1rem; color: var(--primary); font-weight: bold;"></p>
        </div>

        <div class="config-section">
            <h3 style="margin-bottom: 1.5rem;">Auto Recap Configurations</h3>
            <div class="form-group">
                <label>Recap Duration</label>
                <select id="duration">
                    <option value="5">5 Minutes</option>
                    <option value="10">10 Minutes</option>
                    <option value="15">15 Minutes</option>
                </select>
            </div>
            <div class="form-group">
                <label>Subtitle Font Size</label>
                <select id="fontSize">
                    <option value="18">Small (18px)</option>
                    <option value="24" selected>Medium (24px)</option>
                    <option value="32">Large (32px)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Subtitle Color</label>
                <select id="fontColor">
                    <option value="&HFFFFFF">White</option>
                    <option value="&H00FFFF">Yellow</option>
                    <option value="&H0000FF">Red</option>
                </select>
            </div>
            <button class="btn btn-primary" id="triggerBtn" style="width: 100%;">Trigger Auto Generation Pipeline</button>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
